plugins {
    id "com.android.application"
}

android {
    namespace "com.homework.ledger"
    compileSdk 35

    defaultConfig {
        applicationId "com.homework.ledger"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // This directory contains only the retired speech-recognition models.
        // Keep the historical files in the repository, but do not package them.
        main.assets.setSrcDirs([])
    }
}
